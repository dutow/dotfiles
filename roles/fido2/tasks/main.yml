---
- name: Disable targetpw so sudo authenticates as the calling user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/00-no-targetpw
    content: |
      Defaults !targetpw
    mode: '0440'
    validate: 'visudo -cf %s'
  become: true

- name: Create central FIDO2 auth directory
  ansible.builtin.file:
    path: /etc/Yubico
    state: directory
    mode: '0755'
  become: true

- name: Remove obsolete check-local-session script (replaced by pam_succeed_if)
  ansible.builtin.file:
    path: /usr/local/bin/check-local-session
    state: absent
  become: true

- name: Remove obsolete pam_exec.so check-local-session line from common-auth
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: 'pam_exec\.so.*check-local-session'
    state: absent
  become: true

- name: Configure PAM for FIDO2 authentication
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    insertbefore: '^auth\s+(required|requisite|sufficient)\s+pam_unix\.so'
    firstmatch: true
    line: 'auth	sufficient	pam_u2f.so authfile=/etc/Yubico/u2f_keys'
    state: present
  become: true

# pam_u2f.so prompts for a YubiKey touch; that prompt is meaningless over
# SSH (no physical key on the remote side). Skip pam_u2f.so when the PAM
# service is sshd so SSH falls through to pam_unix (password) or relies on
# the SSH key auth that runs before PAM.
- name: Skip FIDO2 in SSH sessions
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    insertbefore: '^auth\s+sufficient\s+pam_u2f\.so'
    firstmatch: true
    line: 'auth	[success=1 default=ignore]	pam_succeed_if.so quiet service = sshd'
    state: present
  become: true
