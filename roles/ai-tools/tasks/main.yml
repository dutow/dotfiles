---
- name: Check if claude is installed
  ansible.builtin.command: which claude
  register: claude_check
  changed_when: false
  failed_when: false

- name: Install Claude Code
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  when: claude_check.rc != 0

- name: Check if codex is installed
  ansible.builtin.shell: "{{ dotfiles_home }}/.local/bin/mise exec -- which codex"
  register: codex_check
  changed_when: false
  failed_when: false

- name: Install ChatGPT Codex
  ansible.builtin.command: "{{ dotfiles_home }}/.local/bin/mise exec -- npm install -g @openai/codex"
  environment:
    PATH: "{{ dotfiles_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
  when: codex_check.rc != 0

- name: Check if opencode is installed
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.opencode/bin/opencode"
  register: opencode_check

- name: Install opencode
  ansible.builtin.shell: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
  when: not opencode_check.stat.exists

- name: Symlink opencode into ~/.local/bin
  ansible.builtin.file:
    src: "{{ dotfiles_home }}/.opencode/bin/opencode"
    dest: "{{ dotfiles_home }}/.local/bin/opencode"
    state: link
    force: true
