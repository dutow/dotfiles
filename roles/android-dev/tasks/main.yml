---
- name: Load distro-specific package names
  ansible.builtin.include_vars: "{{ dotfiles_distro }}.yml"

- name: Install Android development packages (JDK + tooling)
  ansible.builtin.package:
    name: "{{ android_dev_packages }}"
    state: present
  become: true

- name: Install dotfiles-android-init helper
  ansible.builtin.copy:
    src: dotfiles-android-init
    dest: /usr/local/bin/dotfiles-android-init
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install Android Studio (native tarball, no Flatpak sandbox)
  when: dotfiles_env == 'desktop'
  block:
    - name: Check whether Android Studio is installed
      ansible.builtin.stat:
        path: /opt/android-studio/bin/studio.sh
      register: android_studio_installed

    - name: Download and extract Android Studio
      when: not android_studio_installed.stat.exists
      block:
        - name: Download Android Studio tarball
          ansible.builtin.get_url:
            url: "https://redirector.gvt1.com/edgedl/android/studio/ide-zips/{{ android_studio_version }}/{{ android_studio_tarball }}"
            dest: "/tmp/{{ android_studio_tarball }}"
            checksum: "sha256:{{ android_studio_sha256 }}"
            mode: "0644"

        - name: Extract Android Studio to /opt
          ansible.builtin.unarchive:
            src: "/tmp/{{ android_studio_tarball }}"
            dest: /opt
            remote_src: true
            creates: /opt/android-studio
          become: true

    - name: Symlink studio launcher onto PATH
      ansible.builtin.file:
        src: /opt/android-studio/bin/studio.sh
        dest: /usr/local/bin/android-studio
        state: link
      become: true

    - name: Install Android Studio desktop entry
      ansible.builtin.copy:
        dest: /usr/share/applications/android-studio.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Android Studio
          Comment=Android development IDE
          Exec=/opt/android-studio/bin/studio.sh %f
          Icon=/opt/android-studio/bin/studio.png
          Categories=Development;IDE;
          Terminal=false
          StartupNotify=true
          StartupWMClass=jetbrains-studio
      become: true

    # Populate the SDK at the fixed ~/Android/Sdk path so the host (and Android
    # Studio) share the same sdk.dir that dcont containers use. Runs as the
    # invoking user; idempotent (no-op once populated).
    - name: Bootstrap host Android SDK
      ansible.builtin.command: dotfiles-android-init
      register: android_host_sdk
      changed_when: "'already populated' not in android_host_sdk.stdout"

- name: Check whether mitmproxy CA is staged
  ansible.builtin.stat:
    path: "{{ dotfiles_dir }}/.mitmproxy-ca-cert.pem"
  register: android_ca_staged

- name: Import mitmproxy CA into Java truststore
  # sdkmanager validates HTTPS with the JDK's own cacerts, not the system
  # trust store — without this, downloads fail under dcont --audit=strict|soft.
  ansible.builtin.command:
    cmd: >-
      keytool -importcert -noprompt -trustcacerts -storepass changeit
      -alias dcont-mitmproxy
      -file {{ dotfiles_dir }}/.mitmproxy-ca-cert.pem
      -cacerts
  become: true
  register: android_ca_import
  changed_when: "'already exists' not in android_ca_import.stderr"
  failed_when:
    - android_ca_import.rc != 0
    - "'already exists' not in android_ca_import.stderr"
  when: android_ca_staged.stat.exists

- name: Check whether kotlin-language-server is installed
  ansible.builtin.stat:
    path: /opt/kotlin-language-server/bin/kotlin-language-server
  register: kls_installed

- name: Install kotlin-language-server
  when: not kls_installed.stat.exists
  block:
    - name: Download kotlin-language-server release
      ansible.builtin.get_url:
        url: "https://github.com/fwcd/kotlin-language-server/releases/download/{{ kotlin_lsp_version }}/server.zip"
        dest: "/tmp/kotlin-language-server-{{ kotlin_lsp_version }}.zip"
        mode: "0644"
      become: true

    - name: Extract kotlin-language-server
      ansible.builtin.unarchive:
        src: "/tmp/kotlin-language-server-{{ kotlin_lsp_version }}.zip"
        dest: /opt
        remote_src: true
        creates: /opt/server
      become: true

    - name: Move kotlin-language-server into place
      ansible.builtin.command:
        cmd: mv /opt/server /opt/kotlin-language-server
        creates: /opt/kotlin-language-server
      become: true

    - name: Symlink kotlin-language-server onto PATH
      ansible.builtin.file:
        src: /opt/kotlin-language-server/bin/kotlin-language-server
        dest: /usr/local/bin/kotlin-language-server
        state: link
      become: true
